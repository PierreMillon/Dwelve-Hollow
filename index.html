<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dwelve Hollow — test 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M3 12V6l5-3 5 3v6' fill='none' stroke='%2346ffa0' stroke-width='1.2'/%3E%3C/svg%3E">
<style>
  :root {
    --ph-line: #46ffa0;
    --ph-text: #8ffcc4;
    --ph-dim: rgba(70, 255, 160, 0.4);
    --ph-panel: #071812;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: var(--ph-text);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-left: max(14px, env(safe-area-inset-left));
    pointer-events: none;
    text-shadow: 0 0 6px rgba(70, 255, 160, 0.25);
  }
  #hud .title { color: var(--ph-line); letter-spacing: 0.12em; }
  #hud .row { color: var(--ph-dim); }
  #hud .val { color: var(--ph-text); }

  #controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(14px, env(safe-area-inset-left));
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  button, label.fichier {
    font: inherit; color: var(--ph-text);
    background: var(--ph-panel);
    border: 1px solid var(--ph-dim);
    padding: 8px 12px; cursor: pointer;
    letter-spacing: 0.06em; white-space: nowrap;
  }
  button:active, button[aria-pressed="true"] {
    color: #04120c; background: var(--ph-line); border-color: var(--ph-line);
  }
  label.fichier input { display: none; }

  #msg {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--ph-line); text-align: center; padding: 20px;
    display: none; pointer-events: none;
  }
  body.glisse::after {
    content: 'déposer un .obj';
    position: fixed; inset: 12px; border: 1px dashed var(--ph-line);
    display: flex; align-items: center; justify-content: center;
    color: var(--ph-line); letter-spacing: 0.2em; pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="title">DWELVE HOLLOW</div>
  <div class="row">test 3D · v0.3</div>
  <div class="row">modèle <span class="val" id="h-model">—</span></div>
  <div class="row">taille <span class="val" id="h-taille">—</span></div>
  <div class="row">faces <span class="val" id="h-faces">—</span></div>
  <div class="row">rendu <span class="val" id="h-mode">—</span></div>
  <div class="row">segments <span class="val" id="h-seg">—</span></div>
  <div class="row">ips <span class="val" id="h-fps">—</span></div>
</div>

<div id="controls">
  <button id="btn-modele">modèle suivant</button>
  <button id="btn-mode" aria-pressed="false">arêtes vives</button>
  <button id="btn-seuil">seuil 1°</button>
  <button id="btn-spin" aria-pressed="true">rotation</button>
  <label class="fichier">charger un .obj<input type="file" id="fichier" accept=".obj"></label>
</div>

<div id="msg"></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from './vendor/three/OBJLoader.js';
import { OrbitControls } from './vendor/three/OrbitControls.js';

const LINE = 0x46ffa0;        // vert phosphore, repris de Bastion Orbit
const MODELES = [                 // les modèles versionnés du dépôt
  { url: 'models/maison.obj', nom: 'maison' },
  { url: 'models/banc.obj',   nom: 'banc (Poly Haven, CC0)' },
];
const SEUILS = [1, 15, 30, 45]; // degrés — voir majAretes()

// --- scène ---
const scene = new THREE.Scene();

// Caméra ISOMÉTRIQUE, comme les jeux précédents : projection
// ORTHOGRAPHIQUE, donc parallèle — aucun point de fuite, deux cubes de
// même taille se dessinent identiques qu'ils soient devant ou au fond.
// C'est ce qui donne l'impression de dé.
//
// L'angle : en regardant depuis la direction (1,1,1), les trois axes du
// monde se projettent à 120° les uns des autres et les arêtes du sol
// tombent exactement à 30° de l'horizontale — la projection de Bastion
// Orbit, au degré près (voir son project(), cos(π/6)/sin(π/6)).
// L'inclinaison correspondante depuis la verticale vaut arccos(1/√3).
const ISO_POLAIRE = Math.acos(1 / Math.sqrt(3));   // 54,7356°
const ISO_AZIMUT = Math.PI / 4;                    // 45°, le quart de tour de départ
let demiHauteur = 10;                              // moitié de la hauteur du cadrage, en unités du monde

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); // plafonné : sur mobile, 3x ne se voit pas et coûte cher
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// Caméra sur le même principe que Bastion Orbit : on tourne autour d'un
// point fixe et on zoome, jamais de déplacement libre. Ce point est le
// centre d'intérêt de la scène — la place du village, une fois qu'il y
// aura un village ; ici, le centre du modèle chargé.
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;          // pas de déplacement latéral : on reste centré sur la place
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;      // lent : le jeu est contemplatif
// tangage VERROUILLÉ : on tourne autour de la place et on zoome, on ne
// monte ni ne descend jamais la caméra. Les deux bornes sont égales,
// donc l'inclinaison isométrique ne peut pas bouger d'un degré.
controls.minPolarAngle = ISO_POLAIRE;
controls.maxPolarAngle = ISO_POLAIRE;

const materiau = new THREE.LineBasicMaterial({ color: LINE });
const groupeAretes = new THREE.Group();   // EdgesGeometry : seulement les arêtes vives
const groupeFilaire = new THREE.Group();  // WireframeGeometry : tous les triangles
groupeFilaire.visible = false;
scene.add(groupeAretes, groupeFilaire);

let grille = null;
let geometries = [];              // les géométries brutes du modèle courant
let decalage = new THREE.Vector3();
let segAretes = 0, segFilaire = 0, nbFaces = 0;
let modeAretes = true, iSeuil = 0;

// --- affichage d'un modèle chargé ---
function afficher(obj, nom) {
  groupeAretes.clear(); groupeFilaire.clear();
  geometries = []; segFilaire = 0; nbFaces = 0;

  // recentre et pose au sol, quelles que soient les coordonnées d'export
  const boite = new THREE.Box3().setFromObject(obj);
  if (boite.isEmpty()) { message('Aucune géométrie dans ce fichier.'); return; }
  const centre = boite.getCenter(new THREE.Vector3());
  decalage.set(-centre.x, -boite.min.y, -centre.z);

  obj.traverse((enfant) => {
    if (!enfant.isMesh) return;
    const geo = enfant.geometry;
    geometries.push(geo);
    nbFaces += geo.attributes.position.count / 3;

    // WireframeGeometry garde TOUS les côtés de TOUS les triangles,
    // diagonales comprises. Là pour la comparaison, pas pour le rendu final.
    const filaire = new THREE.LineSegments(new THREE.WireframeGeometry(geo), materiau);
    filaire.position.copy(decalage);
    segFilaire += filaire.geometry.attributes.position.count / 2;
    groupeFilaire.add(filaire);
  });

  majAretes();
  cadrer(boite);

  const t = boite.getSize(new THREE.Vector3());
  document.getElementById('h-model').textContent = nom;
  document.getElementById('h-taille').textContent =
    `${t.x.toFixed(1)} × ${t.y.toFixed(1)} × ${t.z.toFixed(1)}`;
  document.getElementById('h-faces').textContent = Math.round(nbFaces);
  majHud();
  message(null);
}

// EdgesGeometry ne garde que les arêtes où deux faces forment un angle
// supérieur au seuil (plus les bords libres). Sur un modèle anguleux, 1°
// suffit ; sur un modèle courbe et dense, un seuil bas redessine chaque
// triangle — c'est le réglage qui décide de la lisibilité du filaire.
function majAretes() {
  groupeAretes.clear();
  segAretes = 0;
  for (const geo of geometries) {
    const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, SEUILS[iSeuil]), materiau);
    l.position.copy(decalage);
    segAretes += l.geometry.attributes.position.count / 2;
    groupeAretes.add(l);
  }
}

// place la caméra et la grille en fonction de la taille du modèle — un
// banc exporté en centimètres et une maison en mètres doivent se cadrer
// aussi bien l'un que l'autre, sans réglage à la main
function cadrer(boite) {
  const t = boite.getSize(new THREE.Vector3());
  const rayon = Math.max(t.x, t.y, t.z) * 0.5 || 1;

  // en projection parallèle, la distance ne change pas la taille à
  // l'écran : c'est la HAUTEUR DU CADRAGE qui fait le cadrage, et la
  // distance sert seulement à garder toute la scène devant la caméra
  demiHauteur = rayon * 1.5;
  const dist = rayon * 6;
  majCadrage();

  camera.near = 0.01;
  camera.far = dist * 4;
  controls.target.set(0, t.y * 0.45, 0);

  // place la caméra sur l'inclinaison isométrique, azimut à 45°
  const sinP = Math.sin(ISO_POLAIRE);
  camera.position.set(
    controls.target.x + dist * sinP * Math.sin(ISO_AZIMUT),
    controls.target.y + dist * Math.cos(ISO_POLAIRE),
    controls.target.z + dist * sinP * Math.cos(ISO_AZIMUT),
  );
  camera.zoom = 1;
  camera.updateProjectionMatrix();
  controls.minZoom = 0.6;   // dézoom : la scène entière tient largement
  controls.maxZoom = 12;    // zoom : de quoi détailler une seule maison
  controls.update();

  if (grille) { scene.remove(grille); grille.geometry.dispose(); grille.material.dispose(); }
  const pas = Math.pow(10, Math.round(Math.log10(rayon))) / 2; // une case ≈ un dixième du modèle
  grille = new THREE.GridHelper(pas * 40, 40, LINE, LINE);
  grille.material.transparent = true;
  grille.material.opacity = 0.13;
  scene.add(grille);
}

// le cadre orthographique dépend de la fenêtre : à recalculer au
// chargement d'un modèle comme à chaque redimensionnement
function majCadrage() {
  const a = innerWidth / innerHeight;
  camera.left = -demiHauteur * a;
  camera.right = demiHauteur * a;
  camera.top = demiHauteur;
  camera.bottom = -demiHauteur;
  camera.updateProjectionMatrix();
}

function message(txt) {
  const m = document.getElementById('msg');
  m.style.display = txt ? 'block' : 'none';
  m.textContent = txt || '';
}

// --- chargements ---
const loader = new OBJLoader();
let iModele = 0;

function chargerModele(i) {
  const m = MODELES[i];
  message('chargement…');
  loader.load(m.url, (o) => afficher(o, m.nom),
    undefined, () => message('Modèle introuvable : ' + m.url));
}
chargerModele(iModele);

document.getElementById('btn-modele').addEventListener('click', () => {
  iModele = (iModele + 1) % MODELES.length;
  chargerModele(iModele);
});

function chargerFichier(f) {
  if (!f) return;
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try { afficher(loader.parse(lecteur.result), f.name); }
    catch (e) { message('Fichier illisible : ' + e.message); }
  };
  lecteur.readAsText(f);
}
document.getElementById('fichier').addEventListener('change', (e) => chargerFichier(e.target.files[0]));

// glisser-déposer : exporter depuis Blender puis lâcher le fichier sur la
// page, sans passer par le dépôt
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('glisse'); });
addEventListener('dragleave', () => document.body.classList.remove('glisse'));
addEventListener('drop', (e) => {
  e.preventDefault(); document.body.classList.remove('glisse');
  chargerFichier(e.dataTransfer.files[0]);
});

// --- interface ---
const btnMode = document.getElementById('btn-mode');
const btnSeuil = document.getElementById('btn-seuil');
const btnSpin = document.getElementById('btn-spin');

function majHud() {
  document.getElementById('h-mode').textContent = modeAretes ? 'arêtes vives' : 'filaire brut';
  document.getElementById('h-seg').textContent = Math.round(modeAretes ? segAretes : segFilaire);
}
btnMode.addEventListener('click', () => {
  modeAretes = !modeAretes;
  groupeAretes.visible = modeAretes;
  groupeFilaire.visible = !modeAretes;
  btnMode.textContent = modeAretes ? 'arêtes vives' : 'filaire brut';
  btnMode.setAttribute('aria-pressed', String(!modeAretes));
  majHud();
});
btnSeuil.addEventListener('click', () => {
  iSeuil = (iSeuil + 1) % SEUILS.length;
  btnSeuil.textContent = 'seuil ' + SEUILS[iSeuil] + '°';
  majAretes();
  majHud();
});
btnSpin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnSpin.setAttribute('aria-pressed', String(controls.autoRotate));
});

addEventListener('resize', () => {
  majCadrage();
  renderer.setSize(innerWidth, innerHeight);
});

// exposé pour le débogage depuis la console du navigateur (et pour les
// vérifications automatisées) — même esprit que les réglages debug du
// menu des autres jeux
window.DH = { scene, camera, controls, renderer, THREE };

// --- boucle ---
const champIps = document.getElementById('h-fps');
let images = 0, dernierCompte = performance.now();

renderer.setAnimationLoop((maintenant) => {
  controls.update();
  renderer.render(scene, camera);
  images++;
  if (maintenant - dernierCompte >= 1000) {
    champIps.textContent = Math.round(images * 1000 / (maintenant - dernierCompte));
    images = 0; dernierCompte = maintenant;
  }
});
</script>
</body>
</html>
